# Taruh di: /etc/nginx/sites-available/wa-gateway.conf  (lalu symlink ke sites-enabled)
# Ganti wa.example.com dengan domain Anda. Port 3000 = WEB_PORT di .env.
#
# Rate-limit zone HARUS di konteks http. Jika nginx global Anda memakai conf.d,
# pindahkan 2 baris limit_req_zone ke /etc/nginx/conf.d/wa-gateway-zones.conf.

limit_req_zone $binary_remote_addr zone=wagw_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=wagw_api:10m   rate=60r/s;

upstream wagw_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP → HTTPS (+ jalur validasi certbot)
server {
    listen 80;
    listen [::]:80;
    server_name wa.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wa.example.com;

    ssl_certificate     /etc/letsencrypt/live/wa.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wa.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Header keamanan
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Brute force login: server action POST ke /login
    location = /login {
        limit_req zone=wagw_login burst=10 nodelay;
        proxy_pass http://wagw_web;
        include /etc/nginx/snippets/wagw-proxy.conf;
    }

    location /api/ {
        limit_req zone=wagw_api burst=100 nodelay;
        proxy_pass http://wagw_web;
        include /etc/nginx/snippets/wagw-proxy.conf;
    }

    # aset statis Next.js: cache panjang
    location /_next/static/ {
        proxy_pass http://wagw_web;
        include /etc/nginx/snippets/wagw-proxy.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://wagw_web;
        include /etc/nginx/snippets/wagw-proxy.conf;
    }
}
