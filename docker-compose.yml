# PRODUKSI — menempel ke infra bersama dari repo `devops`
# (https://github.com/ridhoreynaldo/devops): Postgres+PgBouncer, Redis queue, nginx gateway.
#
# Tidak ada database/redis/nginx di sini. Semua service bergabung ke network
# `global-gateway-net` yang dibuat oleh devops, dan nginx gateway mem-proxy ke
# container `wa_gateway_web:3000` lewat network itu (tidak ada port yang di-publish).
#
#   Lokasi di server : /opt/devops/04-apps/wa-gateway   (di-clone oleh devops/bootstrap.sh)
#   Jalankan          : docker compose up -d --build
#   Standalone/dev    : lihat docker-compose.standalone.yml & docker-compose.dev.yml

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app: &app
  env_file: .env
  networks: [global-gateway-net]
  logging: *logging
  security_opt: ["no-new-privileges:true"]

services:
  migrate:
    <<: *app
    build: { context: ., target: migrate }
    image: wa-gateway-migrate
    container_name: wa_gateway_migrate
    restart: "no"

  web:
    <<: *app
    build: { context: ., target: web }
    image: wa-gateway-web
    container_name: wa_gateway_web      # ← nama ini dirujuk vhost nginx di devops
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }

  worker:
    <<: *app
    build: { context: ., target: worker }
    image: wa-gateway-worker
    container_name: wa_gateway_worker
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }

networks:
  global-gateway-net:
    external: true   # dibuat oleh devops: docker network create global-gateway-net
