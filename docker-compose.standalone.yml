# STANDALONE — semua dalam satu stack (tanpa repo devops): postgres + pgbouncer + redis + migrate + web + worker.
# Cocok untuk VPS kecil yang hanya menjalankan wa-gateway. Web dibuka di 127.0.0.1:${WEB_PORT},
# taruh reverse proxy apa pun (nginx/caddy) di depannya.
#
#   docker compose -f docker-compose.standalone.yml up -d --build
#
# Di .env pakai host service compose ini:
#   DATABASE_URL=postgres://wagw:PASS@pgbouncer:6432/wagw
#   DATABASE_URL_DIRECT=postgres://wagw:PASS@postgres:5432/wagw
#   REDIS_URL=redis://:PASS@redis:6379

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wagw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: ${POSTGRES_DB:-wagw}
      TZ: UTC
    command: >
      postgres -c shared_buffers=512MB -c effective_cache_size=1536MB -c work_mem=16MB
      -c maintenance_work_mem=128MB -c max_connections=100 -c random_page_cost=1.1
      -c checkpoint_completion_target=0.9 -c wal_compression=on
      -c log_min_duration_statement=500 -c shared_preload_libraries=pg_stat_statements
      -c idle_in_transaction_session_timeout=60000
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    shm_size: 256mb
    logging: *logging

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-wagw}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-wagw}
      LISTEN_PORT: "6432"
      POOL_MODE: transaction          # wajib: app memakai prepare:false
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      SERVER_RESET_QUERY: DISCARD ALL
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction WAJIB untuk BullMQ; AOF supaya antrian selamat dari restart
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?isi REDIS_PASSWORD di .env} --appendonly yes --appendfsync everysec
      --maxmemory 256mb --maxmemory-policy noeviction
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]
    logging: *logging

  migrate:
    build: { context: ., target: migrate }
    image: wa-gateway-migrate
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [backend]

  web:
    build: { context: ., target: web }
    image: wa-gateway-web
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"   # hanya localhost → taruh reverse proxy di depan
    mem_limit: 512m
    networks: [backend]
    logging: *logging

  worker:
    build: { context: ., target: worker }
    image: wa-gateway-worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    stop_grace_period: 30s
    mem_limit: 1g
    networks: [backend]
    logging: *logging

networks:
  backend:

volumes:
  pgdata:
  redisdata:
